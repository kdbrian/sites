name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: bash -n
        run: for f in sites tests/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -x -S warning sites tests/*.sh

  smoke:
    name: smoke tests (no containers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tests/smoke.sh

  integration:
    name: integration (podman)
    runs-on: ubuntu-latest
    needs: [lint, smoke]
    steps:
      - uses: actions/checkout@v5
      - name: install podman-compose
        run: |
          podman --version
          pipx install podman-compose
          podman-compose --version
      - run: tests/integration.sh
